<!DOCTYPE html>
<html lang="en">

<head>
  <title>Server Scripts Resilience Test</title>
</head>

<body>
  <h1>Server Scripts Resilience</h1>

  <p id="resilience-before">start</p>

  <!-- 1. Script calling process.exit(1) inside child process -->
  <script data-bascik-server>
    process.exit(1);
  </script>

  <!-- 2. Script with syntax error -->
  <script data-bascik-server>
    const === invalid_syntax;
  </script>

  <!-- 3. Script producing large stdout payload -->
  <script data-bascik-server>
    const largeStr = 'A'.repeat(50000);
    process.stdout.write(`<div id="large-payload" data-len="${largeStr.length}">LargePayload</div>`);
  </script>

  <!-- 4. Script reading multiple request headers -->
  <script data-bascik-server>
    const req = JSON.parse(process.env.BASCIK_REQUEST);
    const count = Object.keys(req.headers).filter(k => k.startsWith('x-stress-')).length;
    process.stdout.write(`<p id="custom-headers-count">${count}</p>`);
  </script>

  <p id="resilience-after">end</p>
</body>

</html>
