name: Jelly Static Analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  jelly:
    name: Jelly Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Jelly Static Analyzer Globally
        run: npm install -g @cs-au-dk/jelly

      - name: Run Jelly Analysis on package index
        run: jelly --ignore-dependencies pkg/src/index.ts
