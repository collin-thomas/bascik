name: Release

# pkg:    git tag v1.0.0 && git push --tags
# create: git tag create-v1.0.0 && git push --tags
on:
  push:
    tags:
      - 'v*.*.*'
      - 'create-v*.*.*'

jobs:
  release:
    name: Publish @bascik/bascik to npm
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: pkg
        run: pnpm test:ci

      - name: Build
        working-directory: pkg
        run: pnpm build

      - name: Publish to npm
        working-directory: pkg
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-create:
    name: Publish create-bascik to npm
    if: startsWith(github.ref_name, 'create-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: create
        run: pnpm test:ci

      - name: Build
        working-directory: create
        run: pnpm build

      - name: Publish to npm
        working-directory: create
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
