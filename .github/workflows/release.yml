name: Release

# pkg:    git tag v0.2.0 && git push --tags
# create: git tag create-v0.1.0 && git push --tags
on:
  push:
    tags:
      - 'v*.*.*'
      - 'create-v*.*.*'

jobs:
  release:
    name: Publish @bascik/bascik to npm
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        working-directory: pkg
        run: yarn test:ci

      - name: Build
        working-directory: pkg
        run: yarn build

      - name: Publish to npm
        working-directory: pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-create:
    name: Publish create-bascik to npm
    if: startsWith(github.ref_name, 'create-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        working-directory: create
        run: yarn test:ci

      - name: Build
        working-directory: create
        run: yarn build

      - name: Publish to npm
        working-directory: create
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
