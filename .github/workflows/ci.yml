name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node: [24]

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run framework unit tests with coverage
        run: yarn pkg:test:ci

      - name: Run create-bascik unit tests
        run: yarn workspace create-bascik test:ci

      - name: Run docs unit tests
        run: yarn docs:test

  e2e:
    name: E2E Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node: [24]

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build package
        run: yarn pkg:build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run framework E2E tests (static)
        run: yarn pkg:e2e

      - name: Run framework E2E tests (dev server)
        run: yarn pkg:e2e:dev

      - name: Run framework E2E tests (production server)
        run: yarn pkg:e2e:prod

      - name: Run docs E2E tests
        run: yarn docs:e2e

      - name: Run create-bascik scaffold generation test
        run: yarn create:test-site

  extension:
    name: Extension Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node: [24]

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run extension tests
        run: xvfb-run -a yarn ext:test
