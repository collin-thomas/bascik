<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head></docs-head>
  <meta name="description"
    content="Bascik uses GitHub Actions for CI (Vitest on every push) and for releasing @bascik/bascik and create-bascik independently to npm via version tags." />
  <title>CI / CD - Bascik Developer Guide</title>
</head>

<body>

  <docs-nav></docs-nav>

  <div class="container">
    <div class="docs-layout">

      <docs-sidebar></docs-sidebar>

      <main class="docs-content">
        <p class="section-label">Internals</p>

        <!-- Content rendered from docs/content/internals/ci-cd.md at build time.
             To update page content, edit the MD file — not this file. -->
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderMd } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/md-renderer.mjs')).href
          );
          console.log(await renderMd('./content/internals/ci-cd.md'));
        </script>

      </main>
    </div>
  </div>

  <docs-footer></docs-footer>

</body>

</html>
