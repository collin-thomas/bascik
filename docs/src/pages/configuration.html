<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head></docs-head>
  <meta name="description"
    content="Create a bascik.config.js file in your project root to override any default settings and configure your Bascik build." />
  <title>Configuration — Bascik Docs</title>
</head>

<body>

  <docs-nav></docs-nav>

  <div class="container">
    <div class="docs-layout">
      <docs-sidebar></docs-sidebar>

      <main class="docs-content">
        <p class="section-label">Reference</p>
        <h1>Configuration</h1>
        <p class="page-intro">Create a <code>bascik.config.js</code> file in your project root to override any default
          settings.</p>

        <!-- Content rendered from docs/content/config.md at build time.
             To update page content, edit the MD file — not this file. -->
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderMd } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/md-renderer.mjs')).href
          );
          console.log(await renderMd('./content/config.md', { skipFirstHeading: true }));
        </script>

        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderPagination } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.mjs')).href);
          console.log(renderPagination('/configuration'));
        </script>

      </main>
    </div>
  </div>

  <docs-footer></docs-footer>
</body>

</html>
