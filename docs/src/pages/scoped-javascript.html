<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head></docs-head>
  <meta name="description"
    content="Bascik rewrites DOM selector calls inside component script tags to be scoped to the current component instance automatically." />
  <title>Scoped JavaScript - Bascik Docs</title>
</head>

<body>

  <docs-nav></docs-nav>

  <div class="container">
    <div class="docs-layout">
      <docs-sidebar></docs-sidebar>

      <main class="docs-content">
        <p class="section-label">Feature</p>
        <!-- Content rendered from docs/content/scoped-js.md at build time.
             To update page content, edit the MD file - not this file. -->
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderMd } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/md-renderer.mjs')).href
          );
          console.log(await renderMd('./content/scoped-js.md', { stripDemoBlocks: true }));
        </script>

        <h2>Live Demo</h2>
        <p>Two independent counters, each one only controls its own count. Click + or − in one; the other stays put.</p>
        </p>

        <component-demo style="margin-top:24px" data-bascik-prop-file="src/components/demo-counter/">
          <div data-bascik-slot="example">
            <div style="display:flex;gap:32px;flex-wrap:wrap;justify-content:center;padding:8px 0">
              <demo-counter data-bascik-prop-label="Counter A"></demo-counter>
              <demo-counter data-bascik-prop-label="Counter B"></demo-counter>
            </div>
          </div>
          <div data-bascik-slot="source-usage">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { join } from 'node:path';
                import { pathToFileURL } from 'node:url';
                const { extractDemoBlock } = await import(pathToFileURL(join(process.cwd(), 'scripts/md-renderer.mjs')).href);
                console.log(await extractDemoBlock('./content/scoped-js.md', 'source-usage'));
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="source-html">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { join } from 'node:path';

            </code-block>
          </div>

              </script>
            </code-block>
          </div>
          <div data-bascik-slot="source-js">

              <script data-bascik-build>
                import { join } from 'node:path';
                import { pathToFileURL } from 'node:url';

              </script>
            </code-block>
          </div>

                import { join } from 'node:path';

                console.log(await extractDemoBlock('./content/scoped-js.md', 'output-html'));
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="output-css">

                import { join } from 'node:path';

          </div>

          </div>
        </component-demo>

        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderPagination } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.mjs')).href);
          console.log(renderPagination('/scoped-javascript'));
        </script>

      </main>
    </div>
  </div>

  <docs-footer></docs-footer>
</body>

</html>
