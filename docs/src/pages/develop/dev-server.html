<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head></docs-head>
  <meta name="description"
    content="Bascik's development server is a TLS-enabled HTTP/2 server that serves transpiled pages from memory and broadcasts live-reload events." />
  <title>Dev Server — Bascik Developer Guide</title>
</head>

<body>

  <docs-nav></docs-nav>

  <div class="container">
    <div class="docs-layout">

      <docs-sidebar></docs-sidebar>

      <main class="docs-content">
        <p class="section-label">Internals</p>
        <script data-bascik-build>
          import { readFile } from 'node:fs/promises';
          import { marked } from 'marked';

          marked.use({
            renderer: {
              code({ text, lang }) {
                const encoded = text.replace(/\n( *)/g, (_, s) => '&#10;' + s.replace(/ /g, '&#32;'));
                const attr = lang ? ` data-bascik-prop-lang="${lang}"` : '';
                return `<code-block${attr}>${encoded}</code-block>`;
              }
            }
          });

          const md = await readFile('./content/develop/dev-server.md', 'utf8');
          console.log(marked(md));
        </script>
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderPagination } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.mjs')).href);
          console.log(renderPagination('/develop/dev-server'));
        </script>

      </main>
    </div>
  </div>

  <docs-footer></docs-footer>

</body>

</html>
