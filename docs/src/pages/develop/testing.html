<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testing — Bascik Developer Guide</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>

  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { renderNav } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.mjs')).href);
    console.log(renderNav('/develop/testing'));
  </script>

  <div class="container">
    <div class="docs-layout">

      <script data-bascik-build>
        import { join } from 'node:path';
        import { pathToFileURL } from 'node:url';
        const { renderSidebar } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.mjs')).href);
        console.log(renderSidebar('/develop/testing'));
      </script>

      <main class="docs-content">
        <script data-bascik-build>
          import { readFile } from 'node:fs/promises';
          import { marked } from 'marked';

          marked.use({
            renderer: {
              code({ text, lang }) {
                const encoded = text.replace(/\n( *)/g, (_, s) => '&#10;' + s.replace(/ /g, '&#32;'));
                const attr = lang ? ` data-bascik-prop-lang="${lang}"` : '';
                return `<code-block${attr}>${encoded}</code-block>`;
              }
            }
          });

          const md = await readFile('./content/develop/testing.md', 'utf8');
          console.log(marked(md));
        </script>
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderPagination } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.mjs')).href);
          console.log(renderPagination('/develop/testing'));
        </script>

      </main>
    </div>
  </div>

  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { renderFooter } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.mjs')).href);
    console.log(renderFooter());
  </script>

</body>

</html>
