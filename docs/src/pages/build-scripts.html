<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head></docs-head>
  <meta name="description"
    content="Build-time scripts let you run Node.js code at transpile time and inject the output directly into your HTML. No runtime overhead." />
  <title>Build-time Scripts - Bascik Docs</title>
</head>

<body>

  <docs-nav></docs-nav>

  <div class="container">
    <div class="docs-layout">
      <docs-sidebar></docs-sidebar>

      <main class="docs-content">
        <p class="section-label">Feature</p>

        <!-- Content rendered from docs/content/build-scripts.md at build time.
             To update page content, edit the MD file - not this file. -->
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderMd } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/md-renderer.mjs')).href
          );
          console.log(await renderMd('./content/build-scripts.md', { stripDemoBlocks: true }));
        </script>

        <h2>Live Build Script Example</h2>
        <p>The card below was generated by a build script that read a Markdown file and passed its first paragraph to a
          component as a prop.</p>

        <component-demo data-bascik-prop-file="src/pages/build-scripts.html">
          <div data-bascik-slot="example">
            <script data-bascik-build>
              import { readFile } from 'node:fs/promises';
              import { marked } from 'marked';
              const md = await readFile('./content/overview.md', 'utf8');
              const firstPara = md.split('\n\n')[1];
              console.log(`
                <feature-card
                  data-bascik-prop-label="Build Time"
                  data-bascik-prop-title="Generated from Markdown"
                  data-bascik-prop-desc="${marked.parseInline(firstPara).replace(/"/g, '&quot;')}">
                </feature-card>
              `);
            </script>
          </div>
          <div data-bascik-slot="code">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { join } from 'node:path';
                import { pathToFileURL } from 'node:url';
                const { extractDemoBlock } = await import(pathToFileURL(join(process.cwd(), 'scripts/md-renderer.mjs')).href);
                console.log(await extractDemoBlock('./content/build-scripts.md', 'code'));
              </script>
            </code-block>
          </div>
          <div data-bascik-slot="output">
            <code-block data-bascik-prop-lang="html">
              <script data-bascik-build>
                import { join } from 'node:path';
                import { pathToFileURL } from 'node:url';
                const { extractDemoBlock } = await import(pathToFileURL(join(process.cwd(), 'scripts/md-renderer.mjs')).href);
                console.log(await extractDemoBlock('./content/build-scripts.md', 'output'));
              </script>
            </code-block>
          </div>
        </component-demo>

        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderPagination } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.mjs')).href);
          console.log(renderPagination('/build-scripts'));
        </script>

      </main>
    </div>
  </div>

  <docs-footer></docs-footer>
</body>

</html>
