<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Bascik Docs</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .not-found-hero {
      padding: 120px 0 80px;
      text-align: center;
      background: radial-gradient(ellipse 70% 50% at 50% -5%, rgba(211, 255, 141, 0.07), transparent);
    }

    .not-found-title {
      font-size: clamp(3rem, 8vw, 6rem);
      margin: 16px 0;
      font-weight: 800;
    }

    .not-found-desc {
      font-size: 1.25rem;
      max-width: 520px;
      margin: 0 auto 36px;
      color: var(--fg-muted, #8b949e);
    }
  </style>
</head>

<body>

  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { renderNav } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.mjs')).href);
    console.log(renderNav(''));
  </script>

  <section class="not-found-hero">
    <div class="container">
      <span class="badge">404 Error</span>
      <h1 class="not-found-title"><span class="text-accent">Page Not Found</span></h1>
      <p class="not-found-desc">The page you are looking for might have been removed, had its name changed, or is
        temporarily unavailable.</p>
      <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap">
        <a href="/" class="btn btn-primary">Go Home</a>
        <a href="/getting-started" class="btn btn-ghost">Getting Started</a>
      </div>
    </div>
  </section>

  <script data-bascik-build>
    import { join } from 'node:path';
    import { pathToFileURL } from 'node:url';
    const { renderFooter } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.mjs')).href);
    console.log(renderFooter());
  </script>

</body>

</html>
