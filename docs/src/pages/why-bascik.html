<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head></docs-head>
  <meta name="description"
    content="The guiding principle behind Bascik is simple: use what already exists. Do not invent new abstractions where plain HTML already works." />
  <title>Why Bascik — Bascik Docs</title>
</head>

<body>

  <docs-nav></docs-nav>

  <div class="container">
    <div class="docs-layout">

      <docs-sidebar></docs-sidebar>

      <main class="docs-content">
        <p class="section-label">Philosophy</p>
        <!-- Content rendered from docs/content/why-bascik.md at build time.
             To update page content, edit the MD file — not this file. -->
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderMd } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/md-renderer.mjs')).href
          );
          console.log(await renderMd('./content/why-bascik.md'));
        </script>

        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderPagination } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.mjs')).href);
          console.log(renderPagination('/why-bascik'));
        </script>

      </main>
    </div>
  </div>

  <docs-footer></docs-footer>
</body>

</html>
