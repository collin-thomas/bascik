<!DOCTYPE html>
<html lang="en">

<head>
  <docs-head></docs-head>
  <meta name="description"
    content="A complete audit of which CSS and JavaScript patterns Bascik's build-time scoping engine supports, with notes on known edge cases." />
  <title>Scoping Compatibility - Bascik Docs</title>
  <style>
    .compat-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      margin: 16px 0 32px;
    }

    .compat-table th {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 2px solid var(--border);
      color: var(--fg-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .compat-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .compat-table tr:last-child td {
      border-bottom: none;
    }

    .badge-ok {
      color: #7ecfa0;
      font-size: 0.9rem;
      text-align: center;
    }

    .badge-partial {
      color: #b89340;
      font-size: 0.9rem;
      text-align: center;
    }

    .badge-no {
      color: #c07070;
      font-size: 0.9rem;
      text-align: center;
    }

    .badge-intentional {
      color: #7a8795;
      font-size: 0.9rem;
      text-align: center;
    }

    .compat-note {
      color: var(--fg-muted);
      font-size: 0.82rem;
      margin-top: 4px;
    }

    .legend {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 32px;
      font-size: 0.88rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    p:has(> strong:only-child)+ul {
      margin-block-start: 4px;
    }
  </style>
</head>

<body>

  <docs-nav></docs-nav>

  <div class="container">
    <div class="docs-layout">

      <docs-sidebar></docs-sidebar>

      <main class="docs-content">
        <p class="section-label">Reference</p>
        <!-- Content rendered from docs/content/compatibility.md at build time.
             To update page content, edit the MD file - not this file. -->
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderMd } = await import(
            pathToFileURL(join(process.cwd(), 'scripts/md-renderer.mjs')).href
          );
          let html = await renderMd('./content/compatibility.md');
          html = html.replace(/<table>/g, '<table class="compat-table">');
          html = html
            .replace(/<td>\s*✓\s*<\/td>/g, '<td class="badge-ok">✓</td>')
            .replace(/<td>\s*△\s*<\/td>/g, '<td class="badge-partial">△</td>')
            .replace(/<td>\s*✕\s*<\/td>/g, '<td class="badge-no">✕</td>')
            .replace(/<td>\s*–\s*<\/td>/g, '<td class="badge-intentional">–</td>')
            .replace(/<li>✓ /g, '<li><span class="badge-ok">✓</span> ')
            .replace(/<li>△ /g, '<li><span class="badge-partial">△</span> ')
            .replace(/<li>– /g, '<li><span class="badge-intentional">–</span> ')
            .replace(/<li>✕ /g, '<li><span class="badge-no">✕</span> ');
          console.log(html);
        </script>

        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { renderPagination } = await import(pathToFileURL(join(process.cwd(), 'scripts/render-nav.mjs')).href);
          console.log(renderPagination('/compatibility'));
        </script>

      </main>
    </div>
  </div>

  <docs-footer></docs-footer>
</body>

</html>
