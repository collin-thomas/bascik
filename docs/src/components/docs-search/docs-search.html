<button type="button" class="dnav-search-btn" aria-label="Search docs" aria-expanded="false">
  <svg class="search-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="11" cy="11" r="8"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
  <span class="search-btn-text">Search docs…</span>
  <kbd class="search-btn-kbd">⌘K</kbd>
</button>

<div class="search-overlay" hidden>
  <div class="search-backdrop"></div>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search documentation">
    <div class="search-input-row">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="search" class="search-input" placeholder="Search docs…" autocomplete="off" spellcheck="false" />
      <kbd class="search-esc">Esc</kbd>
    </div>
    <ul class="search-results" role="listbox" aria-label="Search results"></ul>
    <p class="search-empty" hidden>No results.</p>
    <p class="search-hint">Start typing to search all docs pages.</p>
  </div>
</div>
<script>
  (function () {
    var btn = document.querySelector('.dnav-search-btn');
    var overlay = document.querySelector('.search-overlay');
    var backdrop = document.querySelector('.search-backdrop');
    var input = document.querySelector('.search-input');
    var list = document.querySelector('.search-results');
    var empty = document.querySelector('.search-empty');
    var hint = document.querySelector('.search-hint');

    // Portal to <body> so position:fixed escapes the nav's backdrop-filter stacking context
    document.body.appendChild(overlay);
    var index = null;

    function open() {
      overlay.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
      input.focus();
      if (!index) loadIndex();
    }

    function close() {
      overlay.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
      input.value = '';
      list.innerHTML = '';
      empty.hidden = true;
      hint.hidden = false;
    }

    async function loadIndex() {
      try {
        index = await (await fetch('/assets/search-index.json')).json();
        if (input.value.trim()) runSearch(input.value);
      } catch (e) { }
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function tokens(q) {
      return q.split(/\s+/).filter(function (w) { return w.length >= 2; });
    }

    function score(e, q, toks) {
      var nl = (e.navLabel || '').toLowerCase();
      var h = (e.heading || '').toLowerCase();
      var t = (e.text || '').toLowerCase();
      var nlHits = toks.reduce(function (n, tok) { return n + (nl.includes(tok) ? 1 : 0); }, 0);

      // Tier 1 (≥1000): navLabel match — always outranks heading/text matches
      if (nl === q)                                    return 1600;
      if (nl.startsWith(q))                            return 1400 + nlHits;
      if (nl.includes(q))                              return 1200 + nlHits;
      if (toks.length > 0 && nlHits === toks.length)   return 1100 + nlHits;
      if (nlHits > 0)                                  return 1000 + nlHits * 10;

      // Tier 2 (100–999): heading match — always outranks text-only matches
      if (h) {
        var hHits = toks.reduce(function (n, tok) { return n + (h.includes(tok) ? 1 : 0); }, 0);
        if (h === q)                                   return 600;
        if (h.startsWith(q))                           return 500 + hHits;
        if (h.includes(q))                             return 400 + hHits;
        if (toks.length > 0 && hHits === toks.length)  return 300 + hHits;
        if (hHits > 0)                                 return 100 + hHits * 10;
      }

      // Tier 3 (1–99): text/content match only
      var tHits = toks.reduce(function (n, tok) { return n + (t.includes(tok) ? 1 : 0); }, 0);
      if (t.includes(q))                               return 80 + tHits;
      if (toks.length > 0 && tHits === toks.length)    return 50 + tHits;
      if (tHits > 0)                                   return tHits * 10;

      return 0;
    }

    // Return ~120 chars centred on the first query/token match in text
    function snippet(text, q, toks) {
      if (!text) return '';
      var lo = text.toLowerCase();
      var idx = q ? lo.indexOf(q) : -1;
      if (idx < 0) {
        for (var i = 0; i < toks.length; i++) {
          idx = lo.indexOf(toks[i]);
          if (idx >= 0) break;
        }
      }
      var start = Math.max(0, idx > 40 ? idx - 40 : 0);
      return (start > 0 ? '…' : '') + text.slice(start, start + 120) + (start + 120 < text.length ? '…' : '');
    }

    function basePath(path) { return path.split('#')[0]; }

    function runSearch(query) {
      if (!index) return;
      var q = query.toLowerCase().trim();
      list.innerHTML = '';
      empty.hidden = true;
      hint.hidden = !!q;
      if (!q) return;

      var toks = tokens(q);
      var LIMIT = 13;
      var scored = index
        .map(function (e) { return { e: e, s: score(e, q, toks) }; })
        .filter(function (x) { return x.s > 0; })
        .sort(function (a, b) { return b.s - a.s; });

      var seen = {};
      var top = [];

      // Group dominant page: show page entry then all its h2s in document order.
      // Only trigger when the query unambiguously identifies one page — i.e. exactly
      // one page-level entry scores ≥1100, or one scores strictly higher than all others.
      var pageMatches = scored.filter(function (x) { return x.e.heading === null && x.s >= 1100; });
      var bestPage = pageMatches.length === 1 ? pageMatches[0]
        : (pageMatches.length > 1 && pageMatches[0].s > pageMatches[1].s) ? pageMatches[0]
        : null;
      if (bestPage) {
        var dominantBase = bestPage.e.path;
        index
          .filter(function (e) { return basePath(e.path) === dominantBase; })
          .forEach(function (e) {
            if (!seen[e.path]) { seen[e.path] = true; top.push(e); }
          });
      }

      // Fill remaining slots from scored results
      for (var i = 0; i < scored.length && top.length < LIMIT; i++) {
        var p = scored[i].e.path;
        if (!seen[p]) { seen[p] = true; top.push(scored[i].e); }
      }

      if (!top.length) { empty.hidden = false; return; }

      list.innerHTML = top.map(function (e) {
        var label = e.heading
          ? esc(e.navLabel) + ' <span class="sr-sep">›</span> ' + esc(e.heading)
          : esc(e.navLabel);
        var snip = snippet(e.text, q, toks);
        var snipHtml = snip ? '<span class="sr-text">' + esc(snip) + '</span>' : '';
        return '<li role="option"><a href="' + esc(e.path) + '" class="sr-link">'
          + '<span class="sr-section">' + esc(e.section || '') + '</span>'
          + '<span class="sr-label">' + label + '</span>'
          + snipHtml + '</a></li>';
      }).join('');
    }

    btn.addEventListener('click', open);
    backdrop.addEventListener('click', close);
    input.addEventListener('input', function () { runSearch(input.value); });

    document.addEventListener('keydown', function (e) {
      var isMod = e.metaKey || e.ctrlKey;
      if (isMod && e.key === 'k') { e.preventDefault(); overlay.hidden ? open() : close(); return; }
      if (e.key === 'Escape' && !overlay.hidden) { close(); return; }
      if (!overlay.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
        e.preventDefault();
        var links = Array.from(list.querySelectorAll('.sr-link'));
        if (!links.length) return;
        var cur = document.activeElement;
        var idx = links.indexOf(cur);
        if (e.key === 'ArrowDown') idx = (cur === input || idx < 0) ? 0 : Math.min(idx + 1, links.length - 1);
        else idx = idx > 0 ? idx - 1 : 0;
        links[idx].focus();
      }
    });

    // Adjust keyboard shortcut label for non-Mac
    var kbd = document.querySelector('.search-btn-kbd');
    if (kbd && !/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) {
      kbd.textContent = 'Ctrl+K';
    }

    // Auto-open on /search?q= (for SearchAction)
    if (window.location.pathname === '/search') {
      var q = new URLSearchParams(window.location.search).get('q');
      if (q) { input.value = q; open(); hint.hidden = true; }
      else open();
    }
  })();
</script>
