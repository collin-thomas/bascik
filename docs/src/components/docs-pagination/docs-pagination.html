<nav class="docs-pagination" aria-label="Page navigation"></nav>
<script>
  (function () {
    if (!window.DOCS_NAV) return;
    var flat = [];
    window.DOCS_NAV.forEach(function (g) {
      g.pages.forEach(function (p) { flat.push(p); });
    });
    var path = window.location.pathname;
    var idx = -1;
    for (var i = 0; i < flat.length; i++) {
      if (flat[i].href === path) { idx = i; break; }
    }
    if (idx === -1) return;
    var prev = idx > 0 ? flat[idx - 1] : null;
    var next = idx < flat.length - 1 ? flat[idx + 1] : null;
    if (!prev && !next) return;
    var nav = document.querySelector('.docs-pagination');
    if (!nav) return;
    var html = '';
    if (prev) {
      html += '<a href="' + prev.href + '" data-pg="prev">'
        + '<span data-pg-dir>&#8592; Previous</span>'
        + '<span data-pg-label>' + prev.label + '</span>'
        + '</a>';
    }
    if (next) {
      html += '<a href="' + next.href + '" data-pg="next">'
        + '<span data-pg-dir>Next &#8594;</span>'
        + '<span data-pg-label>' + next.label + '</span>'
        + '</a>';
    }
    nav.innerHTML = html;
  })();
</script>
