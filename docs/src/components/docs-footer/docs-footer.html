<footer class="dfooter">
  <div class="dfooter-container">
    <div class="dfooter-upper">
      <div class="dfooter-brand">
        <a href="/" class="dfooter-logo" aria-label="Bascik home"><docs-logo></docs-logo></a>
        <p class="dfooter-desc">HTML components.<br>Zero runtime.</p>
      </div>
      <div class="dfooter-sitemap">
        <script data-bascik-build>
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { NAV } = await import(pathToFileURL(join(process.cwd(), 'scripts/nav.mjs')).href);
          let html = '';
          for (const section of NAV) {
            html += `<div class="dfooter-col"><p class="dfooter-col-heading">${section.section}</p><ul class="dfooter-col-links">`;
            for (const page of section.pages) {
              html += `<li><a href="${page.href}">${page.label}</a></li>`;
            }
            html += '</ul></div>';
          }
          console.log(html);
        </script>
      </div>
    </div>
    <div class="dfooter-bottom">
      <span class="dfooter-copy">&copy;
        <script data-bascik-build>console.log(new Date().getFullYear())</script> Built with <a href="/">Bascik</a>.
      </span>
      <div class="dfooter-links">
        <a href="https://github.com/collin-thomas/bascik" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://github.com/collin-thomas/bascik/blob/main/pkg/LICENSE" target="_blank"
          rel="noopener noreferrer">License</a>
      </div>
    </div>
  </div>
</footer>
<script>
  document.querySelectorAll('h2 .anchor-link').forEach(function (a) {
    a.addEventListener('click', function (e) {
      // Preserve standard link behaviors (new tab/window, context menu, etc.)
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

      e.preventDefault();

      const href = a.getAttribute('href') || '';
      history.replaceState(null, '', href);

      const id = href.startsWith('#') ? href.slice(1) : '';
      const target = id ? document.getElementById(id) : null;
      if (target) target.scrollIntoView({ block: 'start' });

      Promise.resolve(navigator.clipboard && navigator.clipboard.writeText(location.href))
        .then(function () {
          a.classList.add('copied');
          setTimeout(function () { a.classList.remove('copied'); }, 1500);
        })
        .catch(function () {
          // Clipboard may be unavailable (permissions / non-secure context)
        });
    });
  });
</script>
