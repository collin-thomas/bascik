<div class="demo-box">
  <div class="demo-nav">
    <div class="demo-tabs">
      <button class="demo-tab active" data-tab="preview">Preview</button>
      <button class="demo-tab" data-tab="code">Source</button>
      <button class="demo-tab" data-tab="output">Output</button>
    </div>
    <div class="demo-meta" data-bascik-prop-file></div>
  </div>

  <div class="demo-panes">
    <div class="demo-pane active" data-pane="preview">
      <div class="demo-preview-content">
        <div data-bascik-slot="example"></div>
      </div>
    </div>
    <div class="demo-pane" data-pane="code">
      <div data-bascik-slot="code"></div>
    </div>
    <div class="demo-pane" data-pane="output">
      <div data-bascik-slot="output"></div>
    </div>
  </div>
</div>

<style>
  .demo-box {
    border: 1px solid var(--border);
    border-radius: var(--r);
    margin: 24px 0;
    overflow: hidden;
    background: var(--bg);
  }

  .demo-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-muted);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
  }

  .demo-tabs {
    display: flex;
  }

  .demo-tab {
    padding: 12px 16px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-muted);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
  }

  .demo-tab:hover {
    color: var(--text);
  }

  .demo-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .demo-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  .demo-panes {
    position: relative;
  }

  .demo-pane {
    display: none;
  }

  .demo-pane.active {
    display: block;
  }

  .demo-preview-content {
    padding: 32px;
    background-image:
      linear-gradient(45deg, var(--bg-muted) 25%, transparent 25%),
      linear-gradient(-45deg, var(--bg-muted) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--bg-muted) 75%),
      linear-gradient(-45deg, transparent 75%, var(--bg-muted) 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Override code-block styles inside demo-pane if needed */
  .demo-pane code-block {
    margin: 0;
  }

  .demo-pane .cblock {
    border: none;
    border-radius: 0;
  }
</style>

<script>
  const demoBox = document.querySelector('.demo-box');
  const tabs = demoBox.querySelectorAll('.demo-tab');
  const panes = demoBox.querySelectorAll('.demo-pane');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;

      tabs.forEach(t => t.classList.remove('active'));
      panes.forEach(p => p.classList.remove('active'));

      tab.classList.add('active');
      demoBox.querySelector(`[data-pane="${target}"]`).classList.add('active');
    });
  });
</script>
