<div class="demo-box" id="demo-root">
  <div class="demo-nav">
    <div class="demo-tabs">
      <button class="demo-tab active" data-tab="preview">Preview</button>
      <button class="demo-tab" data-tab="code">Source</button>
      <button class="demo-tab" data-tab="output">Output</button>
    </div>
    <div class="demo-meta" data-bascik-prop-file></div>
  </div>

  <div class="demo-panes">
    <div class="demo-pane active" data-pane="preview">
      <div class="demo-preview-content" data-demo-theme="dark">
        <div data-bascik-slot="example"></div>
      </div>
    </div>
    <div class="demo-pane" data-pane="code" data-demo-pane>
      <tab-bar class="demo-language-tabs" role="tablist" aria-label="Source language">
        <button class="demo-language-tab active" data-language="usage" type="button">Usage</button>
        <button class="demo-language-tab" data-language="html" type="button">HTML</button>
        <button class="demo-language-tab" data-language="css" type="button">CSS</button>
        <button class="demo-language-tab" data-language="js" type="button">JS</button>
      </tab-bar>
      <div class="demo-language-pane active" data-language-pane="usage">
        <div data-bascik-slot="source-usage"></div>
      </div>
      <div class="demo-language-pane" data-language-pane="html">
        <div data-bascik-slot="source-html"></div>
      </div>
      <div class="demo-language-pane" data-language-pane="css">
        <div data-bascik-slot="source-css"></div>
      </div>
      <div class="demo-language-pane" data-language-pane="js">
        <div data-bascik-slot="source-js"></div>
      </div>
      <div data-bascik-slot="code"></div>
    </div>
    <div class="demo-pane" data-pane="output" data-demo-pane>
      <div class="demo-output-header">
        <tab-bar class="demo-language-tabs" role="tablist" aria-label="Output language">
          <button class="demo-language-tab active" data-language="html" type="button">HTML</button>
          <button class="demo-language-tab" data-language="css" type="button">CSS</button>
          <button class="demo-language-tab" data-language="js" type="button">JS</button>
        </tab-bar>
        <details class="demo-info-details">
          <summary class="demo-info-btn" aria-label="Output formatting information" title="Show output format details">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="8" cy="8" r="7"></circle>
              <line x1="8" y1="8" x2="8" y2="12"></line>
              <line x1="8" y1="4" x2="8.01" y2="4"></line>
            </svg>
          </summary>
          <div class="demo-info-notice">
            Output is shown unminified (HTML, CSS, JS, and identifier names) for readability.
          </div>
        </details>
      </div>
      <div class="demo-language-pane active" data-language-pane="html">
        <div data-bascik-slot="output-html"></div>
      </div>
      <div class="demo-language-pane" data-language-pane="css">
        <div data-bascik-slot="output-css"></div>
      </div>
      <div class="demo-language-pane" data-language-pane="js">
        <div data-bascik-slot="output-js"></div>
      </div>
      <div data-bascik-slot="output"></div>
    </div>
  </div>
</div>

<style>
  .demo-box {
    border: 1px solid var(--border);
    border-radius: var(--r);
    margin: 24px 0;
    overflow: hidden;
    background: var(--bg);
  }

  .demo-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-muted);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .demo-nav::-webkit-scrollbar {
    display: none;
  }

  .demo-tabs {
    display: flex;
    flex-shrink: 0;
  }

  .demo-tab {
    padding: 12px 16px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
    position: relative;
    isolation: isolate;
    transition: color 0.2s;
  }

  .demo-tab::before {
    content: '';
    position: absolute;
    inset: 0;
    clip-path: polygon(7px 0%, 100% 0%, calc(100% - 7px) 100%, 0% 100%);
    z-index: -1;
    transition: background .2s;
  }

  @media (hover: hover) {
    .demo-tab:hover {
      color: var(--text);
    }

    .demo-tab:hover:not(.active)::before {
      background: var(--elevated);
    }
  }

  .demo-tab.active {
    color: #18191b;
    font-weight: 600;
  }

  .demo-tab.active::before {
    background: var(--accent);
  }

  .demo-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: var(--mono);
    white-space: nowrap;
    flex-shrink: 0;
    padding-left: 16px;
  }

  .demo-panes {
    position: relative;
  }

  .demo-pane {
    display: none;
  }

  .demo-pane.active {
    display: block;
  }

  .demo-language-tab {
    min-width: 48px;
    padding: 8px 12px;
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 0.75rem;
    background: transparent;
    border: none;
    position: relative;
    isolation: isolate;
    cursor: pointer;
  }

  .demo-language-tab::before {
    content: '';
    position: absolute;
    inset: 0;
    clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
    z-index: -1;
    transition: background .15s;
  }

  .demo-language-tab:hover {
    color: var(--text);
  }

  .demo-language-tab:hover:not(.active)::before {
    background: var(--elevated);
  }

  .demo-language-tab.active {
    color: #18191b;
  }

  .demo-language-tab.active::before {
    background: var(--accent);
  }

  .demo-language-pane {
    display: none;
  }

  .demo-language-pane.active {
    display: block;
  }

  .demo-preview-content {
    padding: 32px;
    background-color: var(--bg);
    background-image:
      linear-gradient(45deg, var(--bg-muted) 25%, transparent 25%),
      linear-gradient(-45deg, var(--bg-muted) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--bg-muted) 75%),
      linear-gradient(-45deg, transparent 75%, var(--bg-muted) 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .demo-pane code-block {
    margin: 0;
  }

  .demo-output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-right: 12px;
    background: var(--bg-muted);
    flex-wrap: wrap;
  }

  .demo-info-details {
    display: contents;
  }

  .demo-info-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--r-sm, 4px);
    cursor: pointer;
    transition: color 0.15s, background-color 0.15s;
    flex-shrink: 0;
  }

  summary.demo-info-btn {
    list-style: none;
  }

  summary.demo-info-btn::-webkit-details-marker {
    display: none;
  }

  .demo-info-btn:hover {
    color: var(--text);
    background: var(--elevated);
  }

  .demo-info-notice {
    flex-basis: 100%;
    padding: 10px 16px;
    font-size: 0.75rem;
    color: var(--text-muted);
    background: var(--bg-muted);
    border-bottom: 1px solid var(--border);
    line-height: 1.4;
  }
</style>

<script>
  const demoBox = document.getElementById('demo-root');
  const tabs = demoBox.querySelectorAll('.demo-tab');
  const panes = demoBox.querySelectorAll('.demo-pane');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;

      tabs.forEach(t => t.classList.remove('active'));
      panes.forEach(p => p.classList.remove('active'));

      tab.classList.add('active');
      demoBox.querySelector(`[data-pane="${target}"]`).classList.add('active');
    });
  });

  demoBox.querySelectorAll('[data-pane="code"], [data-pane="output"]').forEach(pane => {
    const languageTabs = pane.querySelectorAll('.demo-language-tab');
    const languagePanes = pane.querySelectorAll('.demo-language-pane');

    // Hide the language tab bar when none of the language panes have content.
    // Pages that use only the legacy 'code'/'output' slots leave these panes
    // empty, so there is nothing to switch between.
    const hasLanguageContent = Array.from(languagePanes).some(p => p.children.length > 0);
    if (!hasLanguageContent) {
      const tabBar = pane.querySelector('[role="tablist"]');
      if (tabBar) tabBar.style.display = 'none';
    } else {
      // Hide individual language tabs/panes that have no content.
      languageTabs.forEach(tab => {
        const langPane = pane.querySelector(`[data-language-pane="${tab.dataset.language}"]`);
        if (langPane && langPane.children.length === 0) {
          tab.hidden = true;
          tab.classList.remove('active');
          langPane.classList.remove('active');
        }
      });
      // If the default active tab was hidden, activate the first visible one.
      const activeTab = Array.from(languageTabs).find(t => t.classList.contains('active') && !t.hidden);
      if (!activeTab) {
        const firstVisible = Array.from(languageTabs).find(t => !t.hidden);
        if (firstVisible) {
          firstVisible.classList.add('active');
          pane.querySelector(`[data-language-pane="${firstVisible.dataset.language}"]`).classList.add('active');
        }
      }
    }

    languageTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        languageTabs.forEach(item => item.classList.remove('active'));
        languagePanes.forEach(item => item.classList.remove('active'));

        tab.classList.add('active');
        pane.querySelector(`[data-language-pane="${tab.dataset.language}"]`).classList.add('active');
      });
    });
  });
</script>
